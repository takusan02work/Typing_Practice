<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roman Alphabet Typing Master - 20 Words Session</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=JetBrains+Mono:wght@500&display=swap');
        
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f0f2f5;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .char-default { color: #9ca3af; }
        .char-correct { color: #10b981; border-bottom: 2px solid #10b981; }
        .char-wrong { color: #ef4444; background-color: #fee2e2; }
        .cursor { border-left: 2px solid #3b82f6; animation: blink 1s infinite; }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .card {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div id="app" class="w-full max-w-2xl bg-white rounded-3xl card p-8 text-center">
        <!-- Header -->
        <h1 class="text-3xl font-bold text-gray-800 mb-2">タイピング練習 (20語)</h1>
        <p class="text-gray-500 mb-6">全300語からランダムに20個出題されます</p>

        <!-- Stats -->
        <div class="grid grid-cols-3 gap-4 mb-8">
            <div class="bg-blue-50 px-4 py-3 rounded-2xl">
                <span class="block text-xs text-blue-600 font-bold uppercase tracking-wider">Score</span>
                <span id="score" class="text-xl font-bold text-blue-900">0</span>
            </div>
            <div class="bg-green-50 px-4 py-3 rounded-2xl">
                <span class="block text-xs text-green-600 font-bold uppercase tracking-wider">Accuracy</span>
                <span id="accuracy" class="text-xl font-bold text-green-900">100%</span>
            </div>
            <div class="bg-purple-50 px-4 py-3 rounded-2xl">
                <span class="block text-xs text-purple-600 font-bold uppercase tracking-wider">Progress</span>
                <span id="progress-text" class="text-xl font-bold text-purple-900">0 / 20</span>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="w-full bg-gray-100 h-2 rounded-full mb-10 overflow-hidden">
            <div id="progress-bar" class="bg-purple-500 h-full transition-all duration-300" style="width: 0%"></div>
        </div>

        <!-- Display Area -->
        <div class="mb-12 min-h-[160px] flex flex-col justify-center">
            <div id="japanese-text" class="text-4xl font-bold text-gray-800 mb-4 tracking-wider">

            </div>
            <div id="roman-display" class="text-4xl mono font-medium tracking-widest flex justify-center flex-wrap gap-1">
                <span class="text-blue-500 animate-pulse">Press Any Key to Start</span>
            </div>
        </div>

        <!-- Hidden Input for mobile/focus focus -->
        <input type="text" id="hidden-input" class="opacity-0 absolute" autocomplete="off" autofocus>

        <!-- Footer / Restart -->
        <div class="mt-8">
            <button id="restart-btn" class="bg-gray-800 hover:bg-black text-white px-10 py-3 rounded-full font-bold transition-all transform hover:scale-105 active:scale-95">

        ];

        const SESSION_WORD_COUNT = 20; // 1回のセッションで出題する数
        let shuffledWords = [];
        let currentWordIndex = 0;
        let charIndex = 0;
        let score = 0;
        let totalKeys = 0;
        let missKeys = 0;
        let isStarted = false;

        const japaneseTextEl = document.getElementById('japanese-text');
        const romanDisplayEl = document.getElementById('roman-display');
        const scoreEl = document.getElementById('score');
        const accuracyEl = document.getElementById('accuracy');
        const progressTextEl = document.getElementById('progress-text');
        const progressBarEl = document.getElementById('progress-bar');
        const restartBtn = document.getElementById('restart-btn');
        const hiddenInput = document.getElementById('hidden-input');

        function initGame() {
            // 全リストからランダムに指定数（20個）を抽出
            shuffledWords = [...fullWordList]
                .sort(() => Math.random() - 0.5)
                .slice(0, SESSION_WORD_COUNT);
            
            currentWordIndex = 0;
            charIndex = 0;
            score = 0;
            totalKeys = 0;
            missKeys = 0;
            isStarted = true;
            updateStats();
            nextWord();
        }

        function updateStats() {
            scoreEl.textContent = score;
            const acc = totalKeys === 0 ? 100 : Math.max(0, Math.floor(((totalKeys - missKeys) / totalKeys) * 100));
            accuracyEl.textContent = `${acc}%`;
            
            progressTextEl.textContent = `${currentWordIndex} / ${SESSION_WORD_COUNT}`;
            const percent = (currentWordIndex / SESSION_WORD_COUNT) * 100;
            progressBarEl.style.width = `${percent}%`;
        }

        function nextWord() {
            if (currentWordIndex >= shuffledWords.length) {
                finishGame();
                return;
            }

            const word = shuffledWords[currentWordIndex];
            japaneseTextEl.textContent = word.kanji;
            charIndex = 0;
            
            romanDisplayEl.innerHTML = '';
            word.roman.split('').forEach((char, i) => {
                const span = document.createElement('span');
                span.textContent = char;
                span.className = 'char-default px-0.5';
                if (i === 0) span.classList.add('cursor');
                romanDisplayEl.appendChild(span);
            });
            updateStats();
        }

        function finishGame() {
            japaneseTextEl.textContent = "✨ Session Clear! ✨";
            romanDisplayEl.innerHTML = `<span class="text-xl text-gray-400">Score: ${score} | Miss: ${missKeys}</span>`;
            isStarted = false;
            updateStats();
        }

        function handleInput(key) {
            if (!isStarted) {
                initGame();
                return;
            }

            if (key.length !== 1) return;

            const targetWord = shuffledWords[currentWordIndex].roman;
            const spans = romanDisplayEl.querySelectorAll('span');
            
            totalKeys++;

            if (key === targetWord[charIndex]) {
                spans[charIndex].className = 'char-correct px-0.5';
                charIndex++;
                
                if (charIndex < targetWord.length) {
                    spans[charIndex].classList.add('cursor');
                } else {
                    score += targetWord.length * 10;
                    currentWordIndex++;
                    setTimeout(nextWord, 50);
                }
            } else {
                missKeys++;
                spans[charIndex].classList.add('char-wrong');
                setTimeout(() => {
                    spans[charIndex].classList.remove('char-wrong');
                }, 150);
            }
            updateStats();
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Tab' || e.key === 'Control' || e.key === 'Alt' || e.key === 'Shift') return;
            handleInput(e.key.toLowerCase());
        });

        document.body.addEventListener('click', () => {
            hiddenInput.focus();
        });

        restartBtn.addEventListener('click', (e) => {
            e.currentTarget.blur();
            initGame();
        });

        // Initialize progress view
        progressTextEl.textContent = `0 / ${SESSION_WORD_COUNT}`;

    </script>
</body>
</html>
